<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GNAAS CCTU | Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="admin-shell">
    <a href="index.html">← Public site</a>
    <h1>Chapter admin</h1>
    <p id="admin-status" role="status"></p>
    <section id="login-panel" class="admin-panel">
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </section>
    <section id="dashboard" class="admin-panel" hidden>
      <button id="logout" type="button">Sign out</button>
      <h2>Latest message</h2>
      <form id="message-form">
        <label>Title <input id="message-title" required maxlength="180" /></label>
        <label>Body <textarea id="message-body" required maxlength="5000" rows="5"></textarea></label>
        <label>Media <input id="message-file" type="file" accept="image/*,video/*" /></label>
        <button class="btn btn-primary" type="submit">Save message</button>
      </form>
      <h2>Media update</h2>
      <form id="media-update-form">
        <label>Title <input id="media-update-title" required maxlength="180" /></label>
        <label>Body <textarea id="media-update-body" rows="3" maxlength="2000"></textarea></label>
        <label>Image or video <input id="media-update-file" type="file" accept="image/*,video/*" required /></label>
        <button class="btn btn-primary" type="submit">Publish media update</button>
      </form>
      <div id="admin-media-updates"></div>
      <h2>Calendar event</h2>
      <form id="event-form">
        <label>Title <input id="event-title" required maxlength="180" /></label>
        <label>Description <textarea id="event-description" rows="3" maxlength="1000"></textarea></label>
        <label>Date and time <input id="event-date" type="datetime-local" required /></label>
        <label>Category <select id="event-category"><option>worship</option><option>social</option><option>outreach</option><option>sports</option></select></label>
        <button class="btn btn-primary" type="submit">Add event</button>
      </form>
      <div id="admin-events"></div>
    </section>
  </main>
  <script src="admin.js" defer></script>
</body>
</html>
